group 'io.mpv.mpv_libs'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'io.mpv.mpv_libs'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar'])
    }
}
