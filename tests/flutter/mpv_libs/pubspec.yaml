name: mpv_libs
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

flutter:
  plugin:
    platforms:
      android:
        package: io.mpv.mpv_libs
        pluginClass: MpvLibsPlugin
      ios:
        pluginClass: MpvLibsPlugin
      linux:
        pluginClass: MpvLibsPlugin
      macos:
        pluginClass: MpvLibsPlugin
      windows:
        pluginClass: MpvLibsPluginCApi
